apply plugin: 'com.android.application'

android {
    compileSdkVersion 30

    signingConfigs {
        sigin {
            storeFile file("BUNNY.jks")
            storePassword "000624"
            keyAlias "bunny"
            keyPassword "426000"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def oldFile = output.outputFile
            def newName = '';
            //只有release编译时生效
            if(variant.buildType.name == 'release') {
                def releaseApkName = "app.apk"
//                def releaseApkName = "app_${variant.buildType.name}.apk"
//                def releaseApkName = "Jade_SHJ_${releaseTime()}_${variant.buildType.name}.apk"
                // 设置apk输出文件夹
                output.getPackageApplication().outputDirectory = new File(project.rootDir.absolutePath + "/Release")
                // 设置apk输出文件名
                output.outputFileName = releaseApkName
            }
        }
    }

    defaultConfig {
        applicationId 'tv.org.eu.bunnyabc'
        minSdkVersion 15
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 26
        versionCode 27
        versionName '0.0.0'
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        signingConfig signingConfigs.sigin
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        // NOTE(2026-10-25): cling core/support 都带 META-INF/beans.xml（CDI 描述），Android 上无用
        exclude 'META-INF/beans.xml'
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            signingConfig signingConfigs.sigin

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
    }

    // 禁用 ABI 分割
    splits {
        abi {
            enable false // 禁用 ABI 分割
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    dexOptions {
        javaMaxHeapSize "4g"
        additionalParameters += '--multi-dex'
        additionalParameters += '--set-max-idx-number=48000'
        additionalParameters += '--minimal-main-dex'
    }
}

def releaseTime() {
    return new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}

task DEBUG_APP(type: Exec) {
    dependsOn 'installDebug' // 先安装 debug 包
    commandLine 'd:/Knowledge/module/adb/adb.exe', 'shell', 'am', 'start', '-n',
            'tv.org.eu.bunnyabc/com.github.tvbox.osc.bbox.ui.activity.HomeActivity'
}

dependencies {
    // NOTE(2026-10-24 API15 port): BouncyCastle 轻量 TLS 栈（TLS1.2/1.3，不依赖平台 JCA）
    // NOTE(2026-10-25): DLNA 接收/投放 —— cling 2.1.2 官方支持 API 15（Cling 2.x 最低要求 platform level 15）
    implementation 'org.fourthline.cling:cling-core:2.1.2'
    implementation 'org.fourthline.cling:cling-support:2.1.2'
    // cling 的 jetty 是 optional 依赖（官方假定宿主自带）——JettyServletContainer 硬依赖，必须显式带上
